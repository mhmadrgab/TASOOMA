name: Apply dashboard update

on:
  push:
    paths:
      - '.github/workflows/apply-dashboard.yml'
      - 'patch_dashboard.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply dashboard patch
        run: python patch_dashboard.py
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No dashboard changes needed"
            exit 0
          fi
          git add index.html
          git commit -m "Match dashboard to reference video"
          git push
